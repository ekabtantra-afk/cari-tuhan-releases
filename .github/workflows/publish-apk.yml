name: Publish APK from EAS

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS Build ID"
        required: true
        default: "bd5abbc2-b486-42fd-8ba7-7cbae7b06be4"
      tag:
        description: "GitHub Release tag"
        required: true
        default: "v1.0.0-build2"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          mkdir -p apk-download
          cd apk-download
          npx --yes eas-cli@24.7.0 build:download --build-id "$BUILD_ID" --non-interactive

          APK_PATH="$(find . -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was downloaded."
            ls -lah
            exit 1
          fi

          mv "$APK_PATH" ../Cari-Tuhan.apk
          cd ..
          ls -lh Cari-Tuhan.apk
          sha256sum Cari-Tuhan.apk > Cari-Tuhan.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            Cari-Tuhan.apk \
            Cari-Tuhan.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cari Tuhan $TAG" \
            --notes "Android APK generated by EAS Build. EAS Build ID: $BUILD_ID" \
            --latest
