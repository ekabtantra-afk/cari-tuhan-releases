name: Publish APK from EAS

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS Build ID"
        required: true
        default: "bd5abbc2-b486-42fd-8ba7-7cbae7b06be4"
      tag:
        description: "GitHub Release tag"
        required: true
        default: "v1.0.0-build2"
  push:
    branches:
      - main
    paths:
      - ".github/trigger-apk.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release repository
        uses: actions/checkout@v4

      - name: Download APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id || 'bd5abbc2-b486-42fd-8ba7-7cbae7b06be4' }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest build:download --build-id "$BUILD_ID" --non-interactive

          APK_PATH="$(find /tmp/runner/eas-cli-nodejs/eas-build-run-cache -type f -name '*.apk' 2>/dev/null | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was found in the EAS download cache."
            find /tmp/runner/eas-cli-nodejs -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/Cari-Tuhan.apk"
          cd "$GITHUB_WORKSPACE"
          ls -lh Cari-Tuhan.apk
          sha256sum Cari-Tuhan.apk > Cari-Tuhan.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v1.0.0-build2' }}
          BUILD_ID: ${{ inputs.build_id || 'bd5abbc2-b486-42fd-8ba7-7cbae7b06be4' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Cari-Tuhan.apk Cari-Tuhan.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cari Tuhan $TAG" --notes "Android APK generated by EAS Build. EAS Build ID: $BUILD_ID" --latest
          else
            gh release create "$TAG"               Cari-Tuhan.apk               Cari-Tuhan.apk.sha256               --repo "$GITHUB_REPOSITORY"               --title "Cari Tuhan $TAG"               --notes "Android APK generated by EAS Build. EAS Build ID: $BUILD_ID"               --latest
          fi
